<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for( 'static' , filename = 'css/styles.css') }}">
    {% block head %}
        <title>flask project</title>
    {% endblock %}
</head>
<body>
    
    {% block content %}
    
        <h1>this is from flask template</h1>
        
        <p>{{userdata.name}}</p>
        <p>{{userdata.marks}}</p>
        <p>{{val}}</p>

        <a href="{{ url_for( 'createStudent' ) }}">go to create studdent form</a>

        <!-- we have to define the function name .... not the url path -->
        <a class="btn btn-outline-success" href="{{ url_for( 'mainFun' ) }}">go to main page</a>

        {% if customername %}
            <h1>{{customername}}</h1> 
        {% endif %}
        
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
